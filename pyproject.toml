[project]
name = "octopus-hw"
version = "4.4.0"
description = "Octopus — Universal Agentic Hardware Controller. MAS.664."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=3.1.1",
    "httpx>=0.27",
    "pyserial>=3.5",
    "flask>=3.0",
    "opencv-python-headless>=4.13.0.92",
    "feetech-servo-sdk>=0.0.4",
]

[project.scripts]
octopus-pipeline = "octopus.orchestrator:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
]
